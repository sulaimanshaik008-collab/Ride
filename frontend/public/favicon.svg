<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="18" fill="#10b981" opacity="0.2" filter="url(#glowBlur)" />

  <!-- RideFlow Key Transit Motif -->
  <g transform="translate(6, 13) scale(0.52)" fill="#10b981">
    <!-- Motorcycle Body -->
    <path d="M28 32 C28 28 35 24 45 24 C55 24 60 21 63 17 L65 14 C66 12 69 11 72 12 L75 14 L73 17 L78 18 C80 18 82 20 82 23 L80 27 L74 27 L70 34 L73 42 C74 44 73 47 70 48 L65 49 L58 41 C54 39 48 39 44 41 L35 44 L28 36 Z" fill="#34d399" />
    <!-- Front Fork & Headlight -->
    <path d="M68 20 L76 38 L85 48 C86 49 85 52 83 53 L80 54 L71 42 L64 24 Z" fill="#6ee7b7" />
    <!-- Seat & Rear Fender -->
    <path d="M22 30 C20 30 18 32 18 34 C18 37 20 38 23 38 L38 38 C40 38 42 36 42 34 L40 30 Z" fill="#34d399" />
    <path d="M15 36 C13 38 12 41 12 44 C12 47 14 50 16 51 L20 48 C18 46 17 44 18 41 C19 39 21 38 23 37 Z" fill="#34d399" />
    <!-- Handlebar & Mirror -->
    <path d="M62 12 L64 6 C64 4 66 3 68 4 L70 5 L68 9 L65 13 Z" fill="#a7f3d0" />
    <!-- Front Wheel -->
    <circle cx="82" cy="46" r="13" stroke="#10b981" stroke-width="6" fill="none" />
    <circle cx="82" cy="46" r="5" fill="#34d399" />
    <!-- Rear Wheel with Key Motif -->
    <circle cx="24" cy="46" r="14" stroke="#10b981" stroke-width="6.5" fill="none" />
    <circle cx="24" cy="46" r="4.5" fill="#34d399" />
    <!-- Key Shaft -->
    <path d="M28 44 L56 44 C57 44 58 45 58 46 C58 47 57 48 56 48 L48 48 L48 51 L45 51 L45 48 L41 48 L41 51 L38 51 L38 48 L28 48 Z" fill="#6ee7b7" />
  </g>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b231c" />
      <stop offset="1" stop-color="#04120e" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="1" stop-color="#059669" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glowBlur" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>
</svg>