# Server Configuration (Render injects $PORT)
server.port=${PORT:8080}

# Application Name
spring.application.name=backend

# Supabase PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:postgres.gmfzoabwnbynfezortpz}
spring.datasource.password=${DB_PASSWORD:rIDE_2#0077}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000

# JPA / Hibernate Configuration
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SMS Provider Configuration
sms.enabled=${SMS_ENABLED:false}
sms.provider=${SMS_PROVIDER:TWILIO}
sms.account.id=${SMS_ACCOUNT_ID:}
sms.auth.token=${SMS_AUTH_TOKEN:}
sms.from.number=${SMS_FROM_NUMBER:}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*],https://*}
